<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹿児島 地形AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #eef2f5; color: #222; }
    header { padding: 12px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    header p { margin: 0; font-size: 13px; color: #555; }
    model-viewer { width: 100%; height: 72vh; background: #ffffff; }
    .hotspot { border: none; background: none; padding: 0; }
    .label {
      background: rgba(255, 255, 255, 0.9); border-radius: 6px; padding: 2px 8px;
      font-size: 12px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transform: translateY(-14px);
    }
    #ar-button {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border: none; border-radius: 24px;
      background: #1a73e8; color: #fff; font-size: 16px;
    }
    footer { padding: 8px 16px 24px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>鹿児島 地形AR</h1>
    <p>鹿児島県本土の地形を、机の上に置ける立体模型にしました（高さは4.0倍に強調）。</p>
  </header>

  <model-viewer
    src="kagoshima.glb"
    ios-src="kagoshima.usdz"
    alt="鹿児島県本土の立体地形模型"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls
    camera-orbit="0deg 55deg auto"
    shadow-intensity="1">
    <button class="hotspot" slot="hotspot-1" data-position="-0.0302m 0.0347m 0.0222m" data-normal="0m 1m 0m"><div class="label">桜島</div></button>
    <button class="hotspot" slot="hotspot-2" data-position="-0.0874m 0.0320m 0.2329m" data-normal="0m 1m 0m"><div class="label">開聞岳</div></button>
    <button class="hotspot" slot="hotspot-3" data-position="0.0604m 0.0462m -0.1600m" data-normal="0m 1m 0m"><div class="label">韓国岳（霧島）</div></button>
    <button class="hotspot" slot="hotspot-4" data-position="-0.0746m 0.0153m 0.0165m" data-normal="0m 1m 0m"><div class="label">鹿児島市</div></button>
    <button class="hotspot" slot="hotspot-5" data-position="-0.0284m 0.0155m 0.3293m" data-normal="0m 1m 0m"><div class="label">佐多岬</div></button>
    <button slot="ar-button" id="ar-button">机に置いてみる</button>
  </model-viewer>

  <footer>
    出典：国土地理院 標高タイル（<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル一覧</a>）を加工して作成
  </footer>
</body>
</html>
