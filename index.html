<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>model-viewer 練習</title>
  <!-- model-viewer 本体を読み込む -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f4f4f4; }
    h1 { font-size: 18px; padding: 12px 16px; margin: 0; }
    model-viewer { width: 100%; height: 70vh; background: #ffffff; }
    /* 自分で作る「ARで見る」ボタン */
    #ar-button {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border: none; border-radius: 24px;
      background: #1a73e8; color: #fff; font-size: 16px;
    }
    p { padding: 0 16px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h1>model-viewer 練習</h1>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="宇宙飛行士の3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls
    auto-rotate
    shadow-intensity="2">
    <!-- slot="ar-button" を付けると、標準のARボタンをこのボタンに差し替えられる -->
    <button slot="ar-button" id="ar-button">ARで見る</button>
  </model-viewer>

  <p>PCではドラッグで回転、ホイールで拡大できます。スマホでは「ARで見る」を押すと、床の上にモデルが置けます。</p>
</body>
</html>
